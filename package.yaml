name:                lsp-export-server
version:             0.1.0.0
synopsis:            A language server that renders documents from their in-memory buffers
license:             BSD-3-Clause
github:              codedownio/lsp-export-server

extra-source-files:
- README.md
- CHANGELOG.md
- cbits/*.h
- cbits/LICENSE

dependencies:
- base >= 4.7 && < 5
- bytestring
- containers
- text

default-extensions:
- OverloadedStrings
- QuasiQuotes
- NamedFieldPuns
- RecordWildCards
- ScopedTypeVariables
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- ViewPatterns
- RankNTypes
- MultiWayIf
- TupleSections
- NumericUnderscores
- TypeApplications
- DataKinds

ghc-options:
- -Wunused-packages
- -Wall
- -fno-warn-name-shadowing

library:
  source-dirs: src
  c-sources: cbits/xdelta3.c
  include-dirs: cbits
  cc-options: -std=c11 -DHAVE_CONFIG_H
  dependencies:
  - aeson
  - base64-bytestring
  - cryptohash-sha256
  - directory
  - filepath
  - lens
  - lsp
  - lsp-export-protocol
  - lsp-types
  - process
  - stm
  - string-interpolate
  - time
  - unix
  - unliftio

executables:
  lsp-export-server:
    main: Main.hs
    source-dirs:
    - app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - directory
    - filepath
    - optparse-applicative
    - lsp-export-protocol
    - lsp-export-server
    - temporary
    - time
    - unliftio

internal-libraries:
  test-lib:
    source-dirs: test-lib
    dependencies:
    - aeson
    - base64-bytestring
    - directory
    - filepath
    - lens
    - lsp-export-protocol
    - lsp-export-server
    - lsp-test
    - lsp-types
    - process
    - sandwich
    - string-interpolate
    - time

tests:
  lsp-export-server-test:
    main: Main.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -W
    build-tools:
    - lsp-export-server:lsp-export-server
    - sandwich:sandwich-discover
    dependencies:
    - aeson
    - filepath
    - lsp-export-protocol
    - lsp-export-server
    - lsp-test
    - sandwich
    - string-interpolate
    - test-lib
    - unliftio
