name:                lsp-export-server
version:             0.4.1.1
synopsis:            A language server that renders documents from their in-memory buffers
license:             BSD-3-Clause
github:              codedownio/lsp-export-server

extra-source-files:
- README.md
- CHANGELOG.md
- cbits/*.h
- cbits/LICENSE

dependencies:
- base >= 4.7 && < 5
- aeson
- bytestring
- containers
- text
- unliftio

default-extensions:
- OverloadedStrings
- QuasiQuotes
- NamedFieldPuns
- RecordWildCards
- ScopedTypeVariables
- FlexibleContexts
- FlexibleInstances
- LambdaCase
- ViewPatterns
- MultiWayIf
- TupleSections
- NumericUnderscores
- TypeApplications
- DataKinds

ghc-options:
- -Wunused-packages
- -Wall
- -fno-warn-name-shadowing

library:
  source-dirs: src
  c-sources: cbits/xdelta3.c
  include-dirs: cbits
  cc-options: -std=c11 -DHAVE_CONFIG_H
  dependencies:
  - base64-bytestring
  - cryptohash-sha256
  - directory
  - filepath
  - lens
  - lsp
  - lsp-types
  - process
  - stm
  - string-interpolate
  - time
  - unix

executables:
  lsp-export-server:
    main: Main.hs
    source-dirs:
    - app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    - -W
    dependencies:
    - directory
    - filepath
    - optparse-applicative
    - lsp-export-server
    - temporary
    - time

tests:
  lsp-export-server-test:
    main: Main.hs
    source-dirs:
    - test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -W
    dependencies:
    - lsp-export-server
    - sandwich
